name: Verify Pocket Pulse
on:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'build.ps1'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and run standalone checks
        shell: pwsh
        run: ./build.ps1 -JavaHome $env:JAVA_HOME -AndroidPlatform "$env:ANDROID_HOME/platforms/android-36" -BuildTools "$env:ANDROID_HOME/build-tools/36.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android runtime and screen checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: pwsh -File tests/VerifyAndroid.ps1 -Adb "$ANDROID_HOME/platform-tools/adb" -JavaHome "$JAVA_HOME" -AndroidPlatform "$ANDROID_HOME/platforms/android-36" -BuildTools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Save screen captures and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation
          path: build/android-validation/
          if-no-files-found: warn
          retention-days: 14
